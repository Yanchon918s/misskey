apiVersion: apps/v1
kind: Deployment
metadata:
  name: misskey-preview
  namespace: misskey-preview
  labels:
    app.kubernetes.io/name: misskey
    app.kubernetes.io/part-of: misskey
spec:
  replicas: 1
  revisionHistoryLimit: 10
  minReadySeconds: 15
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: misskey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: misskey
        app.kubernetes.io/part-of: misskey
        app.kubernetes.io/component: app
        environment: production
      annotations:
        ao9s.net/source-revision: "921820c0c7ae89b39c3f8a829657c30391388112"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 991
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: misskey
          image: ghcr.io/yanchon918s/misskey@sha256:a3354c8be52c3ab360aba261bddaa8eec162dca20feb4313f5f1e86842409230
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 991
            runAsGroup: 991
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: misskey
              containerPort: 3001
          volumeMounts:
            - name: config
              mountPath: /misskey/.config/default.yml
              subPath: default.yml
              readOnly: true
            - name: files
              mountPath: /misskey/files
            - name: misskey-tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command:
                - node
                - -e
                - >-
                  fetch('http://127.0.0.1:3001/api/meta', {method:'POST',
                  headers:{'content-type':'application/json'}, body:'{}'})
                  .then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 72
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - >-
                  fetch('http://127.0.0.1:3001/api/meta', {method:'POST',
                  headers:{'content-type':'application/json'}, body:'{}'})
                  .then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - >-
                  fetch('http://127.0.0.1:3001/api/meta', {method:'POST',
                  headers:{'content-type':'application/json'}, body:'{}'})
                  .then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - sleep 10
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2500Mi
      volumes:
        - name: config
          secret:
            secretName: misskey-preview-core
            defaultMode: 0444
            items:
              - key: default.yml
                path: default.yml
        - name: files
          persistentVolumeClaim:
            claimName: misskey-files
        - name: misskey-tmp
          emptyDir:
            sizeLimit: 1Gi
